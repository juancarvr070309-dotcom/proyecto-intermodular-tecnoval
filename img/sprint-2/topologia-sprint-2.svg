<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><style>
.t{font: bold 24px Arial;fill:#172033}.s{font:18px Arial;fill:#172033}.small{font:15px Arial;fill:#334155}
.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.router{fill:#e0f2fe;stroke:#0369a1;stroke-width:3;rx:16}.lan{fill:#ecfdf5;stroke:#15803d;stroke-width:3;rx:18}.dmz{fill:#fff7ed;stroke:#c2410c;stroke-width:3;rx:18}.line{stroke:#475569;stroke-width:3;fill:none}
</style></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="45" text-anchor="middle" class="t">TecnoVal Asistencia IT — Laboratori Sprint 2</text>
