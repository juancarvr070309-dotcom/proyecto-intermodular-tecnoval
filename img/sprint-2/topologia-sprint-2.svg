<text x="600" y="255" text-anchor="middle" class="t">TV-COMMS</text>
<text x="600" y="290" text-anchor="middle" class="s">Ubuntu Server 24.04 LTS — encaminament + DHCP LAN</text>
<text x="600" y="325" text-anchor="middle" class="small">Exterior: NAT (IP automàtica)</text>
<text x="600" y="352" text-anchor="middle" class="small">LAN: 192.168.10.1/24</text>
<text x="600" y="378" text-anchor="middle" class="small">DMZ: 192.168.30.1/24</text>
<path d="M600 160 V220" class="line"/><text x="620" y="195" class="small">Adaptador 1</text>
<rect x="55" y="470" width="500" height="205" class="lan"/>
<text x="305" y="510" text-anchor="middle" class="t">LAN — TecnoVal-LAN</text>
<text x="305" y="540" text-anchor="middle" class="s">192.168.10.0/24 · Xarxa interna VirtualBox</text>
<rect x="85" y="570" width="190" height="75" class="box"/>
<text x="180" y="600" text-anchor="middle" class="s">TV-CLIENT-WIN</text><text x="180" y="625" text-anchor="middle" class="small">Windows 11 · DHCP</text>
<rect x="335" y="570" width="190" height="75" class="box"/>
<text x="430" y="600" text-anchor="middle" class="s">TV-CLIENT-LINUX</text><text x="430" y="625" text-anchor="middle" class="small">Debian 13 XFCE · DHCP</text>
<rect x="200" y="425" width="210" height="65" class="box"/>
<text x="305" y="453" text-anchor="middle" class="s">TV-SRVINT</text><text x="305" y="477" text-anchor="middle" class="small">Windows Server · .10</text>
<path d="M510 390 L510 425" class="line"/><path d="M510 425 L305 425" class="line"/><path d="M305 425 V470" class="line"/>
<path d="M420 330 H305 V425" class="line"/>
<rect x="645" y="470" width="500" height="205" class="dmz"/>
