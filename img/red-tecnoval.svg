<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:16px}.tiny{font-size:14px}
.box{fill:#f5f8fc;stroke:#355070;stroke-width:2.5;rx:14}.zone{fill:#edf4ff;stroke:#527da8;stroke-width:2;stroke-dasharray:8 6;rx:18}.dmz{fill:#fff2e8;stroke:#bf6c31;stroke-width:2.5;stroke-dasharray:8 6;rx:18}.line{stroke:#43546b;stroke-width:3;fill:none}
</style></defs>
<rect width="1400" height="900" fill="#fff"/>
<text x="700" y="45" text-anchor="middle" class="title">TecnoVal Asistencia IT — Diseño lógico de red</text>
<rect x="555" y="75" width="290" height="65" class="box"/><text x="700" y="105" text-anchor="middle" class="label">Internet / ISP</text><text x="700" y="128" text-anchor="middle" class="small">Conexión del proveedor</text>
<rect x="555" y="175" width="290" height="85" class="box"/><text x="700" y="210" text-anchor="middle" class="label">Firewall / Router</text><text x="700" y="238" text-anchor="middle" class="small">NAT · VLAN · reglas · VPN</text>
<path d="M700 140 V175" class="line"/>
<rect x="500" y="315" width="400" height="85" class="box"/><text x="700" y="350" text-anchor="middle" class="label">Switch gestionable principal</text><text x="700" y="378" text-anchor="middle" class="small">1 × TP-Link TL-SG3428 propuesto</text>
<path d="M700 260 V315" class="line"/>
<rect x="500" y="455" width="400" height="85" class="box"/><text x="700" y="490" text-anchor="middle" class="label">Switch gestionable de acceso</text><text x="700" y="518" text-anchor="middle" class="small">1 × TP-Link TL-SG3428 propuesto</text>
<path d="M700 400 V455" class="line"/><text x="720" y="432" class="tiny">Troncal 802.1Q · VLAN necesarias</text>
<rect x="35" y="600" width="430" height="245" class="zone"/><text x="250" y="635" text-anchor="middle" class="label">Red de usuarios y periféricos</text>
<rect x="60" y="670" width="180" height="70" class="box"/><text x="150" y="700" text-anchor="middle" class="label">Usuarios</text><text x="150" y="725" text-anchor="middle" class="small">VLAN 10 · 12 puestos</text>
<rect x="260" y="670" width="180" height="70" class="box"/><text x="350" y="700" text-anchor="middle" class="label">Impresora</text><text x="350" y="725" text-anchor="middle" class="small">VLAN 50</text>
<rect x="60" y="755" width="180" height="70" class="box"/><text x="150" y="785" text-anchor="middle" class="label">Wi-Fi invitados</text><text x="150" y="810" text-anchor="middle" class="small">VLAN 60</text>
<rect x="260" y="755" width="180" height="70" class="box"/><text x="350" y="785" text-anchor="middle" class="label">Gestión</text><text x="350" y="810" text-anchor="middle" class="small">VLAN 40</text>
<rect x="485" y="600" width="430" height="245" class="zone"/><text x="700" y="635" text-anchor="middle" class="label">Red de servidores</text>
<rect x="510" y="675" width="180" height="70" class="box"/><text x="600" y="705" text-anchor="middle" class="label">Host 1</text><text x="600" y="730" text-anchor="middle" class="small">VM de servicios</text>
<rect x="710" y="675" width="180" height="70" class="box"/><text x="800" y="705" text-anchor="middle" class="label">Host 2</text><text x="800" y="730" text-anchor="middle" class="small">VM de servicios</text>
<rect x="610" y="765" width="180" height="60" class="box"/><text x="700" y="790" text-anchor="middle" class="label">NAS</text><text x="700" y="813" text-anchor="middle" class="small">VLAN 20 · copias</text>
<rect x="935" y="600" width="430" height="245" class="dmz"/><text x="1150" y="635" text-anchor="middle" class="label">DMZ — VLAN 30</text>
<rect x="1035" y="685" width="230" height="85" class="box"/><text x="1150" y="718" text-anchor="middle" class="label">Sin servidor web propio</text><text x="1150" y="746" text-anchor="middle" class="small">Reservada para futuro</text>
<text x="1150" y="805" text-anchor="middle" class="small">Web fase 1: alojamiento externo</text>
<path d="M700 540 V570 H250 V600" class="line"/><path d="M700 570 V600" class="line"/><path d="M700 570 H1150 V600" class="line"/>
<text x="700" y="875" text-anchor="middle" class="tiny">Dos switches gestionables: principal y acceso. Firewall aplica las reglas entre VLAN; invitados y DMZ quedan aislados de redes internas.</text>
</svg>